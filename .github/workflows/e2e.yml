name: E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  caddy-fingerprints:
    name: Caddy JA3/JA4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.18"
          otp-version: "28"

      - name: Prepare isolated build and temporary directories
        env:
          CI_BUILD_PATH: ${{ runner.temp }}/ex_ssl-e2e-build
          CI_TMPDIR: ${{ runner.temp }}/ex_ssl-e2e-tmp
          CI_REPORTS: ${{ runner.temp }}/ex_ssl-e2e-reports
        run: |
          mkdir -p "$CI_BUILD_PATH" "$CI_TMPDIR" "$CI_REPORTS"
          printf 'MIX_BUILD_PATH=%s\nTMPDIR=%s\nCI_REPORT_DIR=%s\n' "$CI_BUILD_PATH" "$CI_TMPDIR" "$CI_REPORTS" >> "$GITHUB_ENV"

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            e2e/deps
            ${{ runner.temp }}/ex_ssl-e2e-build
          key: ${{ runner.os }}-mix-e2e-1.18-28-${{ hashFiles('e2e/mix.lock', 'mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-e2e-1.18-28-

      - name: Build pinned Caddy test server
        run: docker build --tag ex-ssl-caddy-e2e ./e2e

      - name: Start Caddy test server
        run: |
          docker run --rm --detach \
            --name ex-ssl-caddy-e2e \
            --publish 127.0.0.1:8443:8443 \
            ex-ssl-caddy-e2e
          attempt=0
          while [ "$attempt" -lt 30 ]; do
            if ! docker inspect --format '{{.State.Running}}' ex-ssl-caddy-e2e 2>/dev/null | grep -q true; then
              docker logs ex-ssl-caddy-e2e
              exit 1
            fi
            if nc -z 127.0.0.1 8443; then
              exit 0
            fi
            sleep 1
            attempt=$((attempt + 1))
          done
          docker logs ex-ssl-caddy-e2e
          exit 1

      - name: Install e2e dependencies
        working-directory: e2e
        run: mix deps.get

      - name: Compile e2e harness
        working-directory: e2e
        run: mix compile --warnings-as-errors

      - name: Run authenticated fingerprint test
        working-directory: e2e
        run: ../scripts/ci_run_suite.sh --trace --seed 107 test

      - name: Stop Caddy test server
        if: always()
        run: |
          docker logs ex-ssl-caddy-e2e || true
          docker stop ex-ssl-caddy-e2e || true
