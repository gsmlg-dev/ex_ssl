name: TLS interoperability

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      campaign:
        description: Run the additional multi-seed resource campaign
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interop:
    name: OTP and independent TLS peers (${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18"
            otp: "28"
          - elixir: "1.19"
            otp: "28"
          - elixir: "1.20"
            otp: "29"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Prepare isolated build, temporary, and report directories
        env:
          CI_BUILD_PATH: ${{ runner.temp }}/ex_ssl-build-${{ matrix.elixir }}-${{ matrix.otp }}
          CI_TMPDIR: ${{ runner.temp }}/ex_ssl-tmp-${{ matrix.elixir }}-${{ matrix.otp }}
          CI_REPORTS: ${{ runner.temp }}/ex_ssl-reports-${{ matrix.elixir }}-${{ matrix.otp }}
        run: |
          mkdir -p "$CI_BUILD_PATH" "$CI_TMPDIR" "$CI_REPORTS"
          printf 'MIX_BUILD_PATH=%s\nTMPDIR=%s\nCI_REPORT_DIR=%s\n' "$CI_BUILD_PATH" "$CI_TMPDIR" "$CI_REPORTS" >> "$GITHUB_ENV"

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            deps
            ${{ runner.temp }}/ex_ssl-build-${{ matrix.elixir }}-${{ matrix.otp }}
          key: ${{ runner.os }}-mix-interop-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-interop-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Preflight independent peers and record runtime versions
        run: ./scripts/ci_preflight.sh | tee "$CI_REPORT_DIR/preflight.log"

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: env MIX_ENV=test mix compile --warnings-as-errors

      - name: Run mandatory OTP and OpenSSL interoperability tests
        run: >-
          ./scripts/ci_run_suite.sh --only integration --include integration --seed 103 test

      - name: Upload sanitized interop summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: interop-${{ matrix.elixir }}-otp-${{ matrix.otp }}
          path: |
            ${{ env.CI_REPORT_DIR }}/preflight.log
            ${{ env.CI_REPORT_DIR }}/mix-test-summary.txt
          if-no-files-found: error
          retention-days: 7

  resource-campaign:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.campaign)
    name: Multi-seed resource campaign (seed ${{ matrix.seed }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed: [104, 105, 106]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Prepare isolated build, temporary, and report directories
        env:
          CI_BUILD_PATH: ${{ runner.temp }}/ex_ssl-campaign-build-${{ matrix.seed }}
          CI_TMPDIR: ${{ runner.temp }}/ex_ssl-campaign-tmp-${{ matrix.seed }}
          CI_REPORTS: ${{ runner.temp }}/ex_ssl-campaign-reports-${{ matrix.seed }}
        run: |
          mkdir -p "$CI_BUILD_PATH" "$CI_TMPDIR" "$CI_REPORTS"
          printf 'MIX_BUILD_PATH=%s\nTMPDIR=%s\nCI_REPORT_DIR=%s\n' "$CI_BUILD_PATH" "$CI_TMPDIR" "$CI_REPORTS" >> "$GITHUB_ENV"

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            deps
            ${{ runner.temp }}/ex_ssl-campaign-build-${{ matrix.seed }}
          key: ${{ runner.os }}-mix-interop-campaign-1.20-29-${{ matrix.seed }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-interop-campaign-1.20-29-${{ matrix.seed }}-

      - name: Preflight independent peers and record runtime versions
        run: ./scripts/ci_preflight.sh | tee "$CI_REPORT_DIR/preflight.log"

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: env MIX_ENV=test mix compile --warnings-as-errors

      - name: Run multi-seed resource and lifecycle campaign
        run: >-
          ./scripts/ci_run_suite.sh --only integration --include integration --seed ${{ matrix.seed }}
          test/ssl/resumption_resource_test.exs
          test/ssl/connection_lifecycle_test.exs
          test/ssl/connection_backpressure_test.exs
          test/ssl/tls12_interop_test.exs

      - name: Upload sanitized campaign summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: interop-campaign-seed-${{ matrix.seed }}
          path: |
            ${{ env.CI_REPORT_DIR }}/preflight.log
            ${{ env.CI_REPORT_DIR }}/mix-test-summary.txt
          if-no-files-found: error
          retention-days: 7

  downstream-candidate:
    name: Pinned downstream source candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Prepare isolated build, temporary, and report directories
        env:
          CI_BUILD_PATH: ${{ runner.temp }}/ex_ssl-downstream-build
          CI_TMPDIR: ${{ runner.temp }}/ex_ssl-downstream-tmp
          CI_REPORTS: ${{ runner.temp }}/ex_ssl-downstream-reports
        run: |
          mkdir -p "$CI_BUILD_PATH" "$CI_TMPDIR" "$CI_REPORTS"
          printf 'MIX_BUILD_PATH=%s\nTMPDIR=%s\nCI_REPORT_DIR=%s\n' "$CI_BUILD_PATH" "$CI_TMPDIR" "$CI_REPORTS" >> "$GITHUB_ENV"

      - name: Run pinned source candidate and standalone package checks
        run: |
          set -o pipefail
          set +e
          timeout --kill-after=30s 900 bash scripts/downstream_candidate.sh 2>&1 |
            awk '/^(Candidate ex_ssl HEAD:|Pinned http_fetch SHA:|Standalone package\/startup boundary|Standalone loaded ex_ssl:|Pinned downstream source-candidate integration|Source candidate loaded ex_ssl:|[0-9]+ (tests?|properties),|Result: [0-9])/ { print }' |
            tee "$CI_REPORT_DIR/downstream-summary.log"
          status=${PIPESTATUS[0]}
          set -e
          printf 'downstream candidate exit status: %s\n' "$status" >> "$CI_REPORT_DIR/downstream-summary.log"
          test -s "$CI_REPORT_DIR/downstream-summary.log"
          exit "$status"

      - name: Upload sanitized downstream summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: downstream-candidate
          path: ${{ env.CI_REPORT_DIR }}/downstream-summary.log
          if-no-files-found: error
          retention-days: 7
