name: QUIC TLS reference

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - name: Install pinned independent reference
        run: |
          python3 -m venv "$RUNNER_TEMP/quic-tls-venv"
          "$RUNNER_TEMP/quic-tls-venv/bin/pip" install -r e2e/quic_tls/requirements.txt
      - name: Compare both roles and directional secrets
        run: QUIC_TLS_PYTHON="$RUNNER_TEMP/quic-tls-venv/bin/python" mix run e2e/quic_tls/run.exs
