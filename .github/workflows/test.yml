name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18"
            otp: "28"
          - elixir: "1.19"
            otp: "28"
          - elixir: "1.20"
            otp: "29"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Prepare isolated build and temporary directories
        env:
          CI_BUILD_PATH: ${{ runner.temp }}/ex_ssl-test-build-${{ matrix.elixir }}-${{ matrix.otp }}
          CI_TMPDIR: ${{ runner.temp }}/ex_ssl-test-tmp-${{ matrix.elixir }}-${{ matrix.otp }}
        run: |
          mkdir -p "$CI_BUILD_PATH" "$CI_TMPDIR"
          printf 'MIX_BUILD_PATH=%s\nTMPDIR=%s\n' "$CI_BUILD_PATH" "$CI_TMPDIR" >> "$GITHUB_ENV"

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            deps
            ${{ runner.temp }}/ex_ssl-test-build-${{ matrix.elixir }}-${{ matrix.otp }}
          key: ${{ runner.os }}-mix-test-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-test-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get
      - run: env MIX_ENV=test mix compile --warnings-as-errors
      - run: ./scripts/ci_run_suite.sh --seed 101 test
